# Overrides on top of the detekt default config (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    # Enum constructor arguments (e.g. channel width in MHz) are the named constant already.
    ignoreEnums: true
    ignoreAnnotated:
      - Preview
